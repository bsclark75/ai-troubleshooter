define host {
    use linux-server
    host_name ollama
    alias AI
    address ollama
}

define service {
    use                     generic-service
    host_name               ollama
    service_description     Ollama API
    check_command           check_http!-p 11434
}

define host {
    use linux-server
    host_name ai-troubleshooter
    alias app
    address ai-troubleshooter
}

define service {
    use                     generic-service
    host_name               ai-troubleshooter
    service_description     My App
    check_command           check_http!-p 8000 -u /health
}

define service {
    use                     generic-service
    host_name               ollama
    service_description     Ollama API tags
    check_command           check_http!-p 11434 -u /api/tags
}



