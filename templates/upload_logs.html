{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h2>Upload Nagios Log File</h2>

    <p class="text-muted">
        Upload a Nagios log file for batch analysis.
    </p>

    {% if message %}
    <div class="alert alert-success">
        {{ message }}
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form
        action="/upload"
        method="post"
        enctype="multipart/form-data"
        class="card p-4"
    >

        <div class="mb-3">
            <label for="logfile" class="form-label">
                Select Log File
            </label>

            <input
                type="file"
                class="form-control"
                id="logfile"
                name="logfile"
                accept=".log,.txt"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Upload and Analyze
        </button>

        <a href="/" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>
{% endblock %}
